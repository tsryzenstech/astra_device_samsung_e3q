# astraOS board configuration - Samsung Galaxy S24 Ultra (SM-S928B, "e3q")
#
# STATUS: design only. Nothing here has run on a phone. The values are the
# phone's published specifications; the ones marked (probe) are to be
# confirmed with scripts/probe-host.sh. See docs/ARCHITECTURE.md.

DEVICE=e3q
DEVICE_CODENAMES="e3q"
DEVICE_MODEL="Galaxy S24 Ultra"
DEVICE_BRAND=samsung
DEVICE_MANUFACTURER=samsung
SOC=sm8650            # Snapdragon 8 Gen 3 for Galaxy ("pineapple")

# How astraOS runs here: as a guest on One UI's kernel (docs/ARCHITECTURE.md), the way
# OneOS runs a second Android. Not as the phone's own boot chain.
RUN_MODE=guest

# ---- Updates ---------------------------------------------------------------
# The GitHub repository whose releases the phone updates from (see astra's
# docs/VERSIONING.md). A fork sets its own.
: "${OTA_REPOSITORY:=tsryzenstech/astra_device_samsung_e3q}"

# ---- Sources ---------------------------------------------------------------
: "${ASTRA_REPO:=https://github.com/tsryzenstech/astra.git}"
: "${ASTRA_REF:=main}"
: "${ASTRA_SRC:=}"
# The same Alpine userland as sweet (musl, Qt 6, Mesa).
: "${ALPINE_BRANCH:=v3.22}"
: "${ALPINE_MIRROR:=https://dl-cdn.alpinelinux.org/alpine}"

# ---- Display (probe) --------------------------------------------------------
# 1440 x 3120, 6.8" LTPO AMOLED, 1 to 120 Hz. 505 ppi: Android's 450 dpi class.
UI_SCALE=3.0           # 1440 / 3.0 = 480 logical px wide
DISPLAY_REFRESH=120
ANDROID_DENSITY=450    # MyDroid's Android, when installed on top
MOTION_BLUR=true       # Adreno 750

# ---- Battery ----------------------------------------------------------------
BATTERY_CAPACITY_MAH=5000
